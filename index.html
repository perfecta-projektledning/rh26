<title>Röda havet 2026</title>
<style>
:root{--bg:#F6F8F8;--card:#fff;--line:#D5E0E3;--ink:#0A1E24;--muted:#54707A;--accent:#0F6E7B;--flag:#B44E25}
@media (prefers-color-scheme:dark){:root{--bg:#07171C;--card:#0E2229;--line:#1E3A43;--ink:#E1EBED;--muted:#8CA7B0;--accent:#4FB6C2;--flag:#E38455}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#lock{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:32px 22px calc(32px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto}
#lock h1{font-size:30px;letter-spacing:-.02em;margin:0 0 4px}
#lock p{color:var(--muted);margin:0 0 22px}
#lock input[type=password]{width:100%;font:20px -apple-system,sans-serif;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin-bottom:12px}
#lock button{width:100%;font:600 18px -apple-system,sans-serif;padding:15px;border:0;border-radius:12px;background:var(--accent);color:#fff}
#lock label{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:15px;margin:14px 0 0}
#err{color:var(--flag);font-weight:600;min-height:24px;margin:8px 0 0}
#app{display:none}
#bar{position:sticky;top:0;z-index:9;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:var(--bg);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
#bar button{font:600 13px -apple-system,sans-serif;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 10px}
</style>
</head>

  <p>Resplanen är låst. Skriv frasen.</p>
  <form id="f" autocomplete="off">

    <button type="submit">Lås upp</button>
    <label><input id="remember" type="checkbox" checked> Kom ihåg på den här telefonen</label>
    <div id="err"></div>
  </form>
</div>
<div id="app">

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.normalize("NFKC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
async function decrypt(pw){
  const key = await deriveKey(pw);
  const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.ct));
  return new TextDecoder().decode(buf);
}
function render(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.querySelectorAll("style").forEach(st => document.head.appendChild(st.cloneNode(true)));
  const c = document.getElementById("content");
  c.innerHTML = "";
  Array.from(doc.body.children).forEach(n => c.appendChild(n.cloneNode(true)));
  document.getElementById("lock").style.display = "none";
  document.getElementById("app").style.display = "block";
}
async function tryUnlock(pw, remember){
  try{
    const html = await decrypt(pw);
    if(remember){ try{ localStorage.setItem("rh26.pw", pw); }catch(e){} }
    render(html);
    return true;
  }catch(e){ return false; }
}
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const pw = document.getElementById("pw").value.trim();
  const ok = await tryUnlock(pw, document.getElementById("remember").checked);
  document.getElementById("err").textContent = ok ? "" : "Fel fras.";
});
document.getElementById("lockbtn").addEventListener("click", () => { try{ localStorage.removeItem("rh26.pw"); }catch(e){} location.reload(); });
(async () => {
  let saved = null; try{ saved = localStorage.getItem("rh26.pw"); }catch(e){}
  if(saved && await tryUnlock(saved, true)) return;
  document.getElementById("pw").focus();
})();
if("serviceWorker" in navigator){ window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
